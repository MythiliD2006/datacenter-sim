[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datacenter-sim"
version = "2.0.0"
description = "Real-world, multi-user data centre workload simulation with a built-in web control panel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "psutil>=5.9",
    "PyYAML>=6.0",
    "prometheus-client>=0.20",
    "bcrypt>=4.0",
    "locust>=2.29",
    "grpcio>=1.60",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dcsim = "dcsim.cli:main"

[tool.setuptools.packages.find]
include = ["dcsim*"]

[tool.setuptools.package-data]
dcsim = ["defaults/*.yaml", "defaults/profiles/*.yaml", "ui/*", "ui/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
